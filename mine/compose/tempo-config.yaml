server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:431

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wa

query_frontend:
  search:
    max_duration: 0s

ingester:
  max_block_duration: 5

compactor:
  compaction:
    block_retention: 72h